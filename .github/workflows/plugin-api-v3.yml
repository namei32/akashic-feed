name: plugin-api-v3

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: namei32/akashic
          ref: fd8965b6a57962b15093f0d26b34296b5e603ce0
          path: .cache/akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Prepare the Core source validator
        run: uv pip install --system -r .cache/akashic-core/requirements.txt -e .cache/akashic-core/sdk/python
      - name: Check Plugin API v3 with the production Core
        env:
          PYTHONPATH: .cache/akashic-core
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          from agent.plugins.input_preparation import check_plugin_source
          check_plugin_source(Path.cwd())
          PYCODE

  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: namei32/akashic
          ref: 2573c6dd648b9f1000686e7918fe7d7642528571
          path: .cache/akashic-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            .cache/akashic-core/requirements.txt
            mcp/requirements.txt
      - name: Stage exact Feed runtime
        run: |
          python -m venv mcp/.venv
          mcp/.venv/bin/python -m pip install \
            -r .cache/akashic-core/requirements.txt \
            -r mcp/requirements.txt \
            -r .cache/akashic-core/requirements-dev.txt \
            pytest pytest-asyncio
      - name: Run Feed unit tests
        env:
          AKASHIC_AGENT_ROOT: .cache/akashic-core
          AKASHIC_PLUGIN_FIXTURE_PYTHON: ${{ github.workspace }}/mcp/.venv/bin/python
          PYTHONPATH: ${{ github.workspace }}:.cache/akashic-core:mcp/.venv/lib/python3.13/site-packages:${{ github.workspace }}/.cache/akashic-core/sdk/python/src
        run: mcp/.venv/bin/python -m pytest -q mcp/tests tests
      - name: Run pyright
        env:
          AKASHIC_AGENT_ROOT: .cache/akashic-core
          PYTHONPATH: ${{ github.workspace }}:.cache/akashic-core:mcp/.venv/lib/python3.13/site-packages:${{ github.workspace }}/.cache/akashic-core/sdk/python/src
        run: mcp/.venv/bin/pyright plugin.py content_source.py tools.py script_runner.py script_tool.py feed_runtime mcp/scripts scripts
      - name: Compile Python sources
        run: python -m compileall -q plugin.py content_source.py tools.py script_runner.py script_tool.py feed_runtime mcp/scripts scripts tests
      - name: Check diff formatting
        run: git diff --check
